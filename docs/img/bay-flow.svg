<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 540' width='1000' height='540'><defs><marker id='ah' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#2c3e50'/></marker></defs><rect width='100%' height='100%' fill='white'/><text x='500' y='30' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='18' font-weight='700' fill='#1f2d3d'>Per-bay state machine (USB bays 1-8; bay 9 adds the slot power step)</text><rect x='40' y='120' width='150' height='80' rx='8' fill='#e8eef7' stroke='#2c3e50' stroke-width='2'/><text x='115.0' y='144' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2d3d'>IDLE</text><text x='115.0' y='164' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>bay powered,</text><text x='115.0' y='180' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>no drive</text><rect x='240' y='120' width='150' height='80' rx='8' fill='#e8eef7' stroke='#2c3e50' stroke-width='2'/><text x='315.0' y='144' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2d3d'>DETECTED</text><text x='315.0' y='164' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>identify, SMART,</text><text x='315.0' y='180' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>grace countdown</text><rect x='440' y='120' width='150' height='80' rx='8' fill='#e8eef7' stroke='#2c3e50' stroke-width='2'/><text x='515.0' y='144' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2d3d'>RUNNING</text><text x='515.0' y='164' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>method chain,</text><text x='515.0' y='180' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>then verify</text><rect x='640' y='120' width='150' height='80' rx='8' fill='#e8eef7' stroke='#2c3e50' stroke-width='2'/><text x='715.0' y='144' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2d3d'>DONE</text><text x='715.0' y='164' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>certificate,</text><text x='715.0' y='180' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>drive spun down</text><rect x='840' y='120' width='150' height='80' rx='8' fill='#fdecea' stroke='#2c3e50' stroke-width='2'/><text x='915.0' y='144' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2d3d'>ERROR</text><text x='915.0' y='164' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>certificate,</text><text x='915.0' y='180' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>not sanitized</text><line x1='190' y1='160' x2='240' y2='160' stroke='#2c3e50' stroke-width='2' marker-end='url(#ah)'/><text x='215.0' y='154.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#2c3e50'>drive add</text><line x1='390' y1='160' x2='440' y2='160' stroke='#2c3e50' stroke-width='2' marker-end='url(#ah)'/><text x='415.0' y='154.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#2c3e50'>grace over</text><line x1='590' y1='160' x2='640' y2='160' stroke='#2c3e50' stroke-width='2' marker-end='url(#ah)'/><text x='615.0' y='154.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#2c3e50'>verified</text><line x1='590' y1='175' x2='840' y2='175' stroke='#c0392b' stroke-width='2' marker-end='url(#ah)'/><text x='715.0' y='169.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#c0392b'>fail</text><rect x='440' y='280' width='150' height='60' rx='8' fill='#fdecea' stroke='#2c3e50' stroke-width='2'/><text x='515.0' y='304' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2d3d'>ABORTED</text><text x='515.0' y='324' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>certificate: aborted</text><line x1='515' y1='200' x2='515' y2='280' stroke='#c0392b' stroke-width='2' marker-end='url(#ah)'/><text x='515.0' y='234.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#c0392b'>drive removed</text><path d='M715,200 C715,360 115,360 115,200' fill='none' stroke='#2c3e50' stroke-width='2' marker-end='url(#ah)' stroke-dasharray='5 4'/><text x='420' y='372' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#2c3e50'>drive removed (from any state) returns the bay to IDLE</text><rect x='40' y='420' width='920' height='90' rx='8' fill='#fff9e6' stroke='#2c3e50' stroke-width='2'/><text x='500.0' y='444' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2d3d'>Bay 9 (M.2) in front of IDLE</text><text x='500.0' y='464' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>door closed and PEDET = PCIe -> slot power on -> 1 s -> PCIe rescan -> NVMe appears -> IDLE/DETECTED as above</text><text x='500.0' y='480' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#34495e'>door opened at any time -> abort, PCIe remove, slot power off. No device in 10 s -> power off and latch until the door cycles.</text></svg>